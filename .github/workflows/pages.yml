name: Publish and refresh atlas
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Recheck source repositories before publishing
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: atlas-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas
      GITHUB_TOKEN: ${{ github.token }}
      ATLAS_ALLOW_RESTORE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx tsx scripts/state.ts --restore
      - name: Recheck repositories and enrich evidence
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: npx tsx scripts/actions-sync.ts
      - name: Save updated collection state
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          npx tsx scripts/state.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified catalog data'
            git push origin HEAD:main
          fi
      - run: npx tsx scripts/export-pages.ts
      - run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-build/out
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
